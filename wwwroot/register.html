<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KnifeStyle · Registrierung</title>
  <style>
    :root{color-scheme:dark;--bg:#141414;--line:#303030;--text:#c1c1c1;--muted:#8f8f8f;--lime:#7bc215;--red:#df6565}
    *{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:var(--text);font:12px Verdana,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
    .shell{width:min(420px,calc(100% - 28px));background:var(--bg);border:1px solid #3b3b3b;box-shadow:0 14px 45px #0008;position:relative;padding:24px}
    .shell:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#3bafde,#ca46cd,#c9e33a)}
    h1{font-size:15px;color:var(--lime);letter-spacing:1.5px;margin:4px 0 8px}h2{font-size:12px;margin:0 0 16px}.sub{color:var(--muted);line-height:1.7;margin-bottom:16px}
    label{display:block;color:var(--muted);font-size:10px;margin:12px 0 5px}input,button{font:inherit;width:100%;height:34px}input{background:#0c0c0c;border:1px solid #404040;color:var(--text);padding:0 9px;outline:none}input:focus{border-color:var(--lime)}
    button{margin-top:16px;background:linear-gradient(#2a381b,#18200f);border:1px solid #32461b;color:var(--lime);font-weight:bold;cursor:pointer}.status{min-height:28px;padding-top:12px;color:var(--muted);line-height:1.5}.status.ok,a{color:var(--lime)}.status.err{color:var(--red)}
  </style>
</head>
<body><main class="shell">
  <h1>KNIFESTYLE</h1><h2>User-Konto registrieren</h2>
  <div class="sub">Für die Registrierung brauchst du einen einmalig verwendbaren Lizenzschlüssel vom Admin. Die Laufzeit startet nach erfolgreicher Registrierung.</div>
  <form id="registerForm">
    <label for="licenseKey">Lizenzschlüssel</label><input id="licenseKey" autocomplete="off" placeholder="KS-…" required>
    <label for="username">Username (3–32 Zeichen)</label><input id="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required>
    <label for="password">Passwort (mindestens 10 Zeichen)</label><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
    <button type="submit">Konto erstellen</button>
  </form>
  <div id="status" class="status" aria-live="polite"></div>
  <div class="sub" style="margin:10px 0 0">Nach der Registrierung kannst du dich im KnifeStyle Loader anmelden. <a href="/">Adminpanel</a></div>
</main>
<script>
const form=document.getElementById('registerForm'),statusBox=document.getElementById('status');
form.addEventListener('submit',async event=>{event.preventDefault();statusBox.className='status';statusBox.textContent='Registriere…';try{const response=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({licenseKey:document.getElementById('licenseKey').value.trim(),username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Registrierung fehlgeschlagen.');form.reset();statusBox.className='status ok';statusBox.textContent='Konto erstellt. Du kannst dich jetzt im KnifeStyle Loader anmelden.'}catch(error){statusBox.className='status err';statusBox.textContent=error.message}});
</script></body></html>
